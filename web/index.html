<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM 语义导航 Agent · 控制台</title>
<style>
  :root {
    --bg: #070b12;
    --bg-soft: #0b1220;
    --panel: #0e1624;
    --panel-2: #111c2d;
    --line: rgba(120, 170, 215, 0.14);
    --line-strong: rgba(120, 170, 215, 0.26);
    --text: #e6edf6;
    --text-dim: #8fa3ba;
    --text-faint: #64788f;
    --accent: #3ddbb4;
    --accent-soft: rgba(61, 219, 180, 0.12);
    --blue: #6ea8ff;
    --amber: #f7b955;
    --red: #ff6b81;
    --radius: 14px;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(61, 219, 180, 0.09), transparent 60%),
      radial-gradient(700px 400px at 105% 0%, rgba(110, 168, 255, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  button, textarea, input { font: inherit; color: inherit; }

  .app {
    display: grid;
    grid-template-columns: 292px minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- 侧栏 ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 16px;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(14, 22, 36, 0.9), rgba(9, 14, 24, 0.72));
    overflow-y: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 2px 4px 14px;
    border-bottom: 1px solid var(--line);
  }

  .mark {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: linear-gradient(150deg, rgba(61, 219, 180, 0.22), rgba(110, 168, 255, 0.12));
    border: 1px solid rgba(61, 219, 180, 0.32);
    box-shadow: 0 0 22px rgba(61, 219, 180, 0.16);
  }

  .brand h2 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 650;
    letter-spacing: 0.3px;
  }

  .brand p {
    margin: 3px 0 0;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.4px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 13px 14px;
  }

  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 1.4px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 11px;
  }

  .session-line {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
  }

  .session-line code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid rgba(61, 219, 180, 0.2);
    padding: 5px 9px;
    border-radius: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ghost-btn {
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.16s;
    white-space: nowrap;
  }

  .ghost-btn:hover { color: var(--accent); border-color: rgba(61, 219, 180, 0.45); }

  .quick-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .quick-item {
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    cursor: pointer;
    transition: 0.16s;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .quick-item:hover {
    border-color: rgba(61, 219, 180, 0.4);
    transform: translateX(2px);
  }

  .quick-item .tag {
    flex: 0 0 auto;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 5px;
    background: rgba(110, 168, 255, 0.14);
    color: var(--blue);
    letter-spacing: 0.4px;
  }

  .quick-item .tag.warn { background: rgba(247, 185, 85, 0.14); color: var(--amber); }
  .quick-item .tag.danger { background: rgba(255, 107, 129, 0.14); color: var(--red); }
  .quick-item .tag.ok { background: var(--accent-soft); color: var(--accent); }

  .quick-item .txt {
    font-size: 12.5px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .health-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .health-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
  }

  .health-row .label { color: var(--text-faint); width: 62px; flex: 0 0 62px; }

  .health-row .value {
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 7px;
    background: var(--text-faint);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
  }

  .dot.ok { background: var(--accent); box-shadow: 0 0 8px rgba(61, 219, 180, 0.7); }
  .dot.bad { background: var(--red); box-shadow: 0 0 8px rgba(255, 107, 129, 0.6); }
  .dot.warn { background: var(--amber); box-shadow: 0 0 8px rgba(247, 185, 85, 0.6); }

  .sidebar-foot {
    margin-top: auto;
    font-size: 11px;
    line-height: 1.7;
    color: var(--text-faint);
    padding: 4px;
  }

  /* ---------- 主区 ---------- */
  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }

  .main::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.18;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 78%);
  }

  .topbar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 20px 28px 18px;
    border-bottom: 1px solid var(--line);
  }

  .topbar h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: 0.2px;
  }

  .topbar p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--text-faint);
  }

  .switch-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    cursor: pointer;
    user-select: none;
  }

  .switch-wrap span {
    font-size: 12px;
    color: var(--text-dim);
  }

  .switch {
    position: relative;
    width: 32px;
    height: 18px;
    border-radius: 999px;
    background: #253345;
    transition: 0.2s;
    flex: 0 0 32px;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #8fa3ba;
    transition: 0.2s;
  }

  input[type="checkbox"] { display: none; }

  input[type="checkbox"]:checked + .switch { background: rgba(247, 185, 85, 0.3); }
  input[type="checkbox"]:checked + .switch::after {
    left: 16px;
    background: var(--amber);
  }

  .chat {
    position: relative;
    flex: 1;
    overflow-y: auto;
    padding: 26px 28px 10px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  /* 空状态 */
  .empty {
    margin: auto;
    max-width: 560px;
    text-align: center;
    padding-bottom: 40px;
  }

  .empty .ring {
    width: 74px;
    height: 74px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid rgba(61, 219, 180, 0.25);
    background: radial-gradient(circle, rgba(61, 219, 180, 0.14), transparent 70%);
    box-shadow: 0 0 40px rgba(61, 219, 180, 0.12);
  }

  .empty h3 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 600;
  }

  .empty p {
    margin: 0;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text-faint);
  }

  .empty .hints {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }

  .hint {
    border: 1px dashed var(--line-strong);
    background: rgba(17, 28, 45, 0.6);
    color: var(--text-dim);
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: 0.16s;
  }

  .hint:hover {
    color: var(--text);
    border-color: rgba(61, 219, 180, 0.4);
    border-style: solid;
  }

  .hint b { color: var(--accent); font-weight: 600; }

  /* 消息 */
  .msg { display: flex; flex-direction: column; animation: rise 0.28s ease; }
  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .bubble {
    max-width: min(720px, 84%);
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.75;
    font-size: 13.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: linear-gradient(160deg, rgba(61, 219, 180, 0.2), rgba(61, 219, 180, 0.1));
    border: 1px solid rgba(61, 219, 180, 0.3);
    border-bottom-right-radius: 4px;
    color: #d9fff5;
  }

  .msg.agent .bubble {
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg.agent .bubble.failed { border-color: rgba(247, 185, 85, 0.32); }
  .msg.agent .bubble.rejected { border-color: rgba(255, 107, 129, 0.32); }
  .msg.agent .bubble.error { border-color: rgba(255, 107, 129, 0.45); }

  .meta-line {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 11.5px;
    color: var(--text-faint);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2.5px 9px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.3px;
    border: 1px solid transparent;
  }

  .pill.success { color: var(--accent); background: var(--accent-soft); border-color: rgba(61, 219, 180, 0.3); }
  .pill.failed { color: var(--amber); background: rgba(247, 185, 85, 0.12); border-color: rgba(247, 185, 85, 0.3); }
  .pill.rejected { color: var(--red); background: rgba(255, 107, 129, 0.1); border-color: rgba(255, 107, 129, 0.28); }
  .pill.ask_user { color: var(--blue); background: rgba(110, 168, 255, 0.12); border-color: rgba(110, 168, 255, 0.3); }
  .pill.error { color: var(--red); background: rgba(255, 107, 129, 0.14); border-color: rgba(255, 107, 129, 0.4); }

  .tool-name {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    background: rgba(120, 170, 215, 0.08);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 6px;
  }

  .time { color: var(--text-faint); }

  .msg.user .meta-line { justify-content: flex-end; }

  /* 详情 */
  details.trace {
    margin-top: 8px;
    max-width: min(720px, 84%);
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(11, 18, 32, 0.75);
    overflow: hidden;
  }

  details.trace summary {
    list-style: none;
    cursor: pointer;
    padding: 8px 12px;
    font-size: 11.5px;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.3px;
  }

  details.trace summary::-webkit-details-marker { display: none; }

  details.trace summary::before {
    content: "";
    width: 5px;
    height: 5px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg);
    transition: 0.2s;
  }

  details.trace[open] summary::before { transform: rotate(45deg); }
  details.trace summary:hover { color: var(--accent); }

  .trace-body {
    padding: 0 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .kv {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 8px;
    font-size: 11.5px;
    align-items: baseline;
  }

  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; color: var(--text-dim); font-family: var(--mono); word-break: break-all; }

  pre.json {
    margin: 0;
    padding: 10px 12px;
    background: #070d16;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    color: #9fc6e8;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .subsection-label {
    font-size: 10.5px;
    letter-spacing: 1px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* 输入区 */
  .composer {
    position: relative;
    padding: 14px 28px 20px;
    border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(7, 11, 18, 0.4), rgba(7, 11, 18, 0.9));
  }

  .input-shell {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    padding: 10px 10px 10px 15px;
    transition: 0.18s;
  }

  .input-shell:focus-within {
    border-color: rgba(61, 219, 180, 0.45);
    box-shadow: 0 0 0 3px rgba(61, 219, 180, 0.07);
  }

  textarea {
    flex: 1;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    line-height: 1.6;
    max-height: 132px;
    min-height: 24px;
    padding: 3px 0;
    font-size: 13.5px;
  }

  textarea::placeholder { color: var(--text-faint); }

  .send-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 0;
    border-radius: 10px;
    padding: 9px 16px;
    background: linear-gradient(140deg, #46e6be, #2bb894);
    color: #04231b;
    font-weight: 650;
    font-size: 13px;
    cursor: pointer;
    transition: 0.18s;
  }

  .send-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .composer-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 7px;
    padding: 0 3px;
    font-size: 11px;
    color: var(--text-faint);
  }

  #counter.over { color: var(--red); }

  /* 加载 */
  .typing { display: flex; align-items: center; gap: 9px; color: var(--text-faint); font-size: 12px; }
  .typing .bars { display: flex; gap: 3px; }
  .typing .bars i {
    width: 3px;
    height: 11px;
    border-radius: 2px;
    background: var(--accent);
    animation: wave 1s infinite ease-in-out;
  }
  .typing .bars i:nth-child(2) { animation-delay: 0.15s; }
  .typing .bars i:nth-child(3) { animation-delay: 0.3s; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.45); opacity: 0.4; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(120, 170, 215, 0.18); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(120, 170, 215, 0.3); }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 1080px) {
    .app { grid-template-columns: 250px minmax(0, 1fr); }
    .sidebar { padding: 16px 12px; }
    .topbar { padding: 18px 20px 16px; }
    .chat { padding: 22px 20px 8px; }
    .composer { padding: 12px 20px 16px; }
  }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .topbar { padding: 16px 18px; }
    .chat { padding: 20px 18px 8px; }
    .composer { padding: 12px 18px 16px; }
    .bubble, details.trace { max-width: 94%; }
    .empty { padding-bottom: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3ddbb4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="8" width="16" height="12" rx="3" />
          <path d="M12 8V4M9 4h6" />
          <circle cx="9" cy="14" r="1.3" fill="#3ddbb4" stroke="none" />
          <circle cx="15" cy="14" r="1.3" fill="#3ddbb4" stroke="none" />
        </svg>
      </div>
      <div>
        <h2>语义导航 Agent</h2>
        <p>NAV2 · DECISION CONSOLE</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title"><span>会话</span></div>
      <div class="session-line">
        <code id="sessionId">-</code>
        <button class="ghost-btn" id="newSessionBtn">新会话</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title"><span>快捷指令</span></div>
      <div class="quick-list" id="quickList"></div>
    </div>

    <div class="panel">
      <div class="panel-title"><span>运行环境</span><span id="healthTime"></span></div>
      <div class="health-list" id="healthList">
        <div class="health-row"><span class="dot"></span><span class="label">服务</span><span class="value">检测中…</span></div>
      </div>
    </div>

    <div class="sidebar-foot">
      决策层：LangGraph<br />
      执行层：Nav2 Action / ROS 话题 / RAG HTTP
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>LLM 语义导航 Agent</h1>
        <p>自然语言 → 结构化决策 → 受控工具执行</p>
      </div>
      <label class="switch-wrap" title="仅对 mock 导航后端生效">
        <input type="checkbox" id="failToggle" />
        <span class="switch"></span>
        <span>注入导航失败</span>
      </label>
    </div>

    <section class="chat" id="chat">
      <div class="empty" id="empty">
        <div class="ring">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3ddbb4" stroke-width="1.4" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" stroke-dasharray="3 5" />
            <circle cx="12" cy="12" r="3.2" fill="#3ddbb4" stroke="none" />
          </svg>
        </div>
        <h3>输入一条巡检指令</h3>
        <p>Agent 会把自然语言拆成三种决策之一：调用工具、追问、拒绝。<br />所有风险操作在进入模型前就被前置规则拦截。</p>
        <div class="hints">
          <button class="hint" type="button" data-text="去B机房巡检">去<b>B机房</b>巡检</button>
          <button class="hint" type="button" data-text="机器人现在在哪，电量多少">查询机器<b>当前位置与电量</b></button>
          <button class="hint" type="button" data-text="导航一直超时怎么排查">导航一直<b>超时</b>怎么排查</button>
        </div>
      </div>
    </section>

    <form class="composer" id="composer">
      <div class="input-shell">
        <textarea id="input" rows="1" maxlength="200" placeholder="例如：去B机房巡检"></textarea>
        <button class="send-btn" id="sendBtn" type="submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h15M13 6l6 6-6 6" />
          </svg>
          发送
        </button>
      </div>
      <div class="composer-foot">
        <span>上限 200 字 · 仅支持授权点位内的导航、状态查询与知识检索</span>
        <span id="counter">0 / 200</span>
      </div>
    </form>
  </main>
</div>

<script>
(function () {
  "use strict";

  const CHAT_URL = "/agent/chat";
  const HEALTH_URL = "/health";
  const MAX_CHARS = 200;

  const QUICK = [
    { tag: "导航", tone: "ok", text: "去B机房巡检" },
    { tag: "状态", tone: "", text: "机器人现在在哪，电量多少" },
    { tag: "知识", tone: "", text: "导航一直超时怎么排查" },
    { tag: "越权", tone: "warn", text: "去C栋" },
    { tag: "危险", tone: "danger", text: "关闭避障直接冲过去" }
  ];

  const STATUS_TEXT = {
    success: "执行成功",
    failed: "执行失败",
    rejected: "已拒绝",
    ask_user: "需要澄清",
    error: "系统异常"
  };

  const INTENT_TEXT = {
    tool_call: "工具调用",
    ask_user: "追问",
    reject: "拒绝",
    error: "异常"
  };

  const chatEl = document.getElementById("chat");
  const emptyEl = document.getElementById("empty");
  const inputEl = document.getElementById("input");
  const counterEl = document.getElementById("counter");
  const sendBtn = document.getElementById("sendBtn");
  const failToggle = document.getElementById("failToggle");
  const sessionEl = document.getElementById("sessionId");
  const healthListEl = document.getElementById("healthList");
  const healthTimeEl = document.getElementById("healthTime");

  let busy = false;
  let sessionId = loadSession();

  /* ---------- 会话 ---------- */

  function newId() {
    return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }

  function loadSession() {
    let id = "";
    try {
      id = localStorage.getItem("nav_session") || "";
      if (!id) {
        id = newId();
        localStorage.setItem("nav_session", id);
      }
    } catch (e) {
      id = newId();
    }
    return id;
  }

  function setSession(id) {
    sessionId = id;
    sessionEl.textContent = id;
    try { localStorage.setItem("nav_session", id); } catch (e) { /* 忽略 */ }
  }

  function resetChat() {
    chatEl.querySelectorAll(".msg, details.trace, .typing-wrap").forEach((n) => n.remove());
    if (!document.getElementById("empty")) {
      chatEl.appendChild(emptyEl);
    }
    emptyEl.style.display = "";
  }

  /* ---------- 快捷指令 ---------- */

  function renderQuick() {
    const box = document.getElementById("quickList");
    QUICK.forEach((item) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "quick-item";
      const tag = document.createElement("span");
      tag.className = "tag " + (item.tone || "");
      tag.textContent = item.tag;
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = item.text;
      btn.append(tag, txt);
      btn.addEventListener("click", () => sendPreset(item.text));
      box.appendChild(btn);
    });
  }

  /* ---------- 消息渲染 ---------- */

  function timeLabel() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function appendUser(text) {
    if (emptyEl.isConnected) emptyEl.remove();

    const wrap = document.createElement("div");
    wrap.className = "msg user";

    const meta = document.createElement("div");
    meta.className = "meta-line";
    meta.textContent = "你 · " + timeLabel();

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrap.append(meta, bubble);
    chatEl.appendChild(wrap);
    scrollToEnd();
  }

  function appendLoading() {
    const wrap = document.createElement("div");
    wrap.className = "msg agent typing-wrap";

    const meta = document.createElement("div");
    meta.className = "meta-line";
    meta.innerHTML = '<span class="tool-name">agent</span><span>正在推理…</span>';

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = '<span class="bars"><i></i><i></i><i></i></span><span>决策中</span>';

    bubble.appendChild(typing);
    wrap.append(meta, bubble);
    chatEl.appendChild(wrap);
    scrollToEnd();
    return wrap;
  }

  function buildDetail(response) {
    const details = document.createElement("details");
    details.className = "trace";

    const summary = document.createElement("summary");
    summary.textContent = "查看决策详情";
    details.appendChild(summary);

    const body = document.createElement("div");
    body.className = "trace-body";

    body.appendChild(kv("trace_id", response.trace_id));
    body.appendChild(kv("intent", (response.intent || "-") + " / " + (INTENT_TEXT[response.intent] || "-")));
    body.appendChild(kv("tool", response.tool || "无"));

    if (response.data && Object.keys(response.data).length) {
      body.appendChild(label("工具数据"));
      body.appendChild(pre(JSON.stringify(response.data, null, 2)));
    }

    if (response.diagnosis) {
      body.appendChild(label("自动诊断"));
      body.appendChild(pre(JSON.stringify(response.diagnosis, null, 2)));
    }

    details.appendChild(body);
    return details;
  }

  function kv(k, v) {
    const row = document.createElement("dl");
    row.className = "kv";
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");
    dd.textContent = v;
    row.append(dt, dd);
    return row;
  }

  function label(text) {
    const el = document.createElement("div");
    el.className = "subsection-label";
    el.textContent = text;
    return el;
  }

  function pre(text) {
    const el = document.createElement("pre");
    el.className = "json";
    el.textContent = text;
    return el;
  }

  function appendAgent(response, elapsed) {
    const status = response.status || "error";

    const wrap = document.createElement("div");
    wrap.className = "msg agent";

    const meta = document.createElement("div");
    meta.className = "meta-line";

    const pill = document.createElement("span");
    pill.className = "pill " + status;
    pill.textContent = STATUS_TEXT[status] || status;

    const intent = document.createElement("span");
    intent.className = "tool-name";
    intent.textContent = INTENT_TEXT[response.intent] || response.intent || "-";

    const time = document.createElement("span");
    time.className = "time";
    time.textContent = timeLabel() + " · " + (elapsed / 1000).toFixed(1) + "s";

    meta.append(pill, intent, time);
    if (response.tool) {
      const tool = document.createElement("span");
      tool.className = "tool-name";
      tool.textContent = response.tool;
      meta.appendChild(tool);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble " + status;
    bubble.textContent = response.answer || "（无回复内容）";

    wrap.append(meta, bubble);

    if (response.status === "ask_user" && Array.isArray(response.data && response.data.options)) {
      wrap.appendChild(optionRow(response.data.options));
    }

    if (response.trace_id) wrap.appendChild(buildDetail(response));

    chatEl.appendChild(wrap);
    scrollToEnd();
  }

  function appendSystemError(message) {
    const wrap = document.createElement("div");
    wrap.className = "msg agent";

    const meta = document.createElement("div");
    meta.className = "meta-line";
    const pill = document.createElement("span");
    pill.className = "pill error";
    pill.textContent = "请求失败";
    meta.appendChild(pill);

    const bubble = document.createElement("div");
    bubble.className = "bubble error";
    bubble.textContent = message;

    wrap.append(meta, bubble);
    chatEl.appendChild(wrap);
    scrollToEnd();
  }

  function optionRow(options) {
    const row = document.createElement("div");
    row.className = "hints";
    row.style.marginTop = "8px";
    row.style.justifyContent = "flex-start";
    options.forEach((opt) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "hint";
      chip.style.cursor = "pointer";
      chip.textContent = opt;
      chip.addEventListener("click", () => sendPreset(opt));
      row.appendChild(chip);
    });
    return row;
  }

  function scrollToEnd() {
    requestAnimationFrame(() => {
      chatEl.scrollTop = chatEl.scrollHeight;
    });
  }

  /* ---------- 发送 ---------- */

  function sendPreset(text) {
    if (busy) return;
    inputEl.value = text;
    syncInput();
    submit();
  }

  async function submit() {
    if (busy) return;
    const text = inputEl.value.trim();
    if (!text) {
      inputEl.focus();
      return;
    }
    if (text.length > MAX_CHARS) return;

    busy = true;
    sendBtn.disabled = true;

    appendUser(text);
    inputEl.value = "";
    syncInput();
    autoResize();

    const loading = appendLoading();
    const started = performance.now();

    try {
      const resp = await fetch(CHAT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          text: text,
          mock_fail_nav: failToggle.checked
        })
      });

      const elapsed = performance.now() - started;
      loading.remove();

      if (!resp.ok) {
        let detail = "HTTP " + resp.status;
        try {
          const body = await resp.json();
          if (body && body.detail) detail += " · " + body.detail;
        } catch (e) { /* 非 JSON 响应 */ }
        appendSystemError("服务返回异常：" + detail);
        return;
      }

      const data = await resp.json();
      appendAgent(data, elapsed);
    } catch (err) {
      loading.remove();
      appendSystemError("无法连接 Agent 服务，请确认已运行 python main.py。");
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  /* ---------- 健康状态 ---------- */

  async function loadHealth() {
    const rows = [];
    try {
      const resp = await fetch(HEALTH_URL, { cache: "no-store" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const h = await resp.json();

      rows.push(row(h.status === "ok" ? "ok" : "warn", "服务", h.status || "-"));
      rows.push(row(h.nav_backend === "ros" ? "ok" : "warn", "导航", h.nav_backend || "-"));
      rows.push(row(h.llm && h.llm.ok ? "ok" : "bad", "LLM", (h.llm && h.llm.model) || "未配置"));
      rows.push(row(h.redis && h.redis.ok ? "ok" : "warn", "Redis", h.redis && h.redis.ok ? "connected" : "内存降级"));
      rows.push(row("ok", "RAG", (h.rag && h.rag.base_url) || "-"));
      healthTimeEl.textContent = timeLabel();
    } catch (err) {
      rows.push(row("bad", "服务", "未启动"));
      rows.push(row("bad", "LLM", "-"));
      rows.push(row("bad", "Redis", "-"));
      rows.push(row("bad", "RAG", "-"));
    }
    healthListEl.replaceChildren(...rows);
  }

  function row(state, labelText, valueText) {
    const el = document.createElement("div");
    el.className = "health-row";

    const dot = document.createElement("span");
    dot.className = "dot " + state;

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = labelText;

    const value = document.createElement("span");
    value.className = "value";
    value.textContent = valueText;
    value.title = valueText;

    el.append(dot, label, value);
    return el;
  }

  /* ---------- 输入框 ---------- */

  function syncInput() {
    const len = inputEl.value.length;
    counterEl.textContent = len + " / " + MAX_CHARS;
    counterEl.classList.toggle("over", len > MAX_CHARS);
  }

  function autoResize() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 132) + "px";
  }

  /* ---------- 事件绑定 ---------- */

  document.getElementById("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    submit();
  });

  inputEl.addEventListener("input", () => {
    syncInput();
    autoResize();
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });

  document.querySelectorAll(".hint[data-text]").forEach((el) => {
    el.addEventListener("click", () => sendPreset(el.dataset.text));
  });

  document.getElementById("newSessionBtn").addEventListener("click", () => {
    if (busy) return;
    setSession(newId());
    resetChat();
    inputEl.focus();
  });

  /* ---------- 初始化 ---------- */

  setSession(sessionId);
  renderQuick();
  syncInput();
  loadHealth();
  setInterval(loadHealth, 30000);
  inputEl.focus();
})();
</script>
</body>
</html>
